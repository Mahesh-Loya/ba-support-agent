[project]
name = "ba-support-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "sentence-transformers>=3.0",
    "google-genai>=1.0",
    "groq>=0.11",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
